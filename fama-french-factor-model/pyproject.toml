[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ffmodel"
version = "0.1.0"
description = "Fama-French factor models: factor data, time-series regressions, GRS and Fama-MacBeth tests, return attribution"
requires-python = ">=3.9"
dependencies = [
    # numpy 2.0.x (the last line for Python 3.9) built against macOS Accelerate emits
    # spurious floating-point warnings from matmul; the OpenBLAS 1.26 build does not.
    "numpy>=1.23,<2; sys_platform == 'darwin' and python_version < '3.10'",
    "numpy>=1.23; sys_platform != 'darwin' or python_version >= '3.10'",
    "pandas>=2.2",
    "scipy>=1.9",
    "statsmodels>=0.14",
    "matplotlib>=3.6",
    "requests>=2.28",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ffmodel = "ffmodel.cli:main"

[tool.setuptools]
packages = ["ffmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore:urllib3 v2 only supports OpenSSL"]
